# Default values for probar.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: harbor.k8s.home/probar/web-app
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  # CI publishes "<VERSION>-<shortsha>", so override at deploy time:
  #   helm upgrade ... --set image.tag=0.3.0-<shortsha>
  tag: "0.3.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

# fsGroup lets the non-root distroless user (uid/gid 65532) write to the
# mounted data PVC.
podSecurityContext:
  fsGroup: 65532

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Persistent storage for the workout data (programs, sessions, settings,
# profile). Mounted at persistence.mountPath, which PROBAR_DATA_DIR must match.
persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  # storageClass "" uses the cluster default; set to pin a specific class.
  storageClass: ""
  mountPath: /data

# Extra environment for the container. PROBAR_DATA_DIR must match
# persistence.mountPath. Uncomment PROBAR_WRITE_TOKEN (from a Secret) to require
# a bearer token on API writes.
env:
  - name: PROBAR_DATA_DIR
    value: /data
  # - name: PROBAR_WRITE_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: probar-write-token
  #       key: token

service:
  type: ClusterIP
  port: 8080

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /readyz
    port: http

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
